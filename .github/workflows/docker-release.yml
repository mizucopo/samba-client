name: Docker Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version
        id: version
        run: |
          VERSION="$(cat version)"
          # Temporary exception: mizucopo/repo-template#43
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a plain SemVer value" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        env:
          GIT_USER_NAME: "\u307f\u305a"
          GIT_USER_EMAIL: "mizu.copo@gmail.com"
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Check if tag exists
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Temporary exception: mizucopo/repo-template#41
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$VERSION")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "tag $VERSION points to $TAG_COMMIT instead of $GITHUB_SHA" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Temporary exception: mizucopo/repo-template#42
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mizucopo/samba-client:latest
            mizucopo/samba-client:${{ steps.version.outputs.version }}

      - name: Create and push git tag
        env:
          TAG_EXISTS: ${{ steps.tag.outputs.exists }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG_EXISTS" = "false" ]; then
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' \
              '## Docker Image' \
              '' \
              'Pull the Docker image:' \
              '' \
              '```bash'
            printf 'docker pull mizucopo/samba-client:%s\n' "$VERSION"
            printf '%s\n' \
              '```' \
              '' \
              'Or use the latest tag:' \
              '' \
              '```bash' \
              'docker pull mizucopo/samba-client:latest' \
              '```' \
              '' \
              '## Links:' \
              '- [Docker Hub](https://hub.docker.com/r/mizucopo/samba-client)'
            printf '%s\n' \
              "- [Source Code]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$VERSION)"
          } > "$NOTES_FILE"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Release $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
